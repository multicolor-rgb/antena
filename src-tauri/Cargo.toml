[package]
name = "antena"
version = "1.0.0"
description = "Lekkie radio internetowe"
authors = ["Antena"]
edition = "2021"
rust-version = "1.77"

# Android ładuje aplikację jako bibliotekę (.so), dlatego potrzebujemy
# również staticlib/cdylib. Desktop nadal korzysta ze zwykłej binarki.
[lib]
name = "antena_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
url = "2"
# Świadomie bez native-tls: na Androidzie wymagałby OpenSSL z NDK.
# rustls kompiluje się na każdą platformę (Linux, Windows, macOS, Android).
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
