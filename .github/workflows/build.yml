# Buduje Antenę na Linuksa (deb + AppImage) i Windows (instalator .exe, NSIS),
# a następnie tworzy GitHub Release i dołącza do niego zbudowane pliki.
#
# Uruchomienie:
#   - ręcznie:  zakładka "Actions" -> "build" -> "Run workflow"
#               (release powstaje automatycznie z tagiem z wersji, np. v1.0.0;
#                pole "release_tag" pozwala nadpisać ten tag)
#   - z tagiem: git tag v1.0.0 && git push --tags
#               (release z tego tagu)
#
# Projekt nie używa npm/node_modules — "npm" pojawia się tylko po to, żeby pobrać
# gotowe CLI Tauri (npx). Nie trzeba nic instalować lokalnie.
#
# (Chcesz też macOS? Dopisz do macierzy poniżej:
#    - name: macOS (dmg)
#      os: macos-latest
#      artifacts: src-tauri/target/release/bundle/dmg/*.dmg
# )

name: build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Opcjonalny tag dla Release (np. v1.0.0). Puste = tag z wersji w tauri.conf.json."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (deb + AppImage)
            os: ubuntu-22.04
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

          - name: Windows (instalator .exe)
            os: windows-latest
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v4

      - name: Zależności systemowe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache (cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Cele bundli bierze z tauri.conf.json ("targets"):
      #   Linux   -> deb + appimage
      #   Windows -> nsis
      - name: Build
        run: npx --yes @tauri-apps/cli@^2 build

      # Dodatkowo zawsze dostępne w zakładce uruchomienia (sekcja "Artifacts").
      - name: Wgraj artefakty
        uses: actions/upload-artifact@v4
        with:
          name: antena-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # Bez żadnego warunku: jeśli "build" się uda, release zawsze powstaje.
  # (Jeśli ten job jest "skipped", to znaczy że "build" padł — sprawdź jego log.)
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Kolejność: ręcznie wpisany tag > tag, z którego ruszył workflow > v<wersja>
      - name: Ustal tag
        id: t
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="v$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Pobierz wszystkie artefakty
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Podgląd plików
        run: ls -lR dist

      - name: Utwórz / zaktualizuj release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.t.outputs.tag }}
          files: dist/**/*
          generate_release_notes: true
          # draft: true   # odkomentuj, jeśli chcesz najpierw przejrzeć release
