# Buduje Antenę na Linuksa (deb + AppImage) i Windows (instalator .exe, NSIS),
# a przy wypchnięciu tagu dodatkowo tworzy GitHub Release i dołącza do niego pliki.
#
# Uruchomienie:
#   - ręcznie:  zakładka "Actions" -> "build" -> "Run workflow"
#               (buduje i wystawia pliki jako artefakty; wpisz tag w polu
#                "release_tag", aby dodatkowo utworzyć Release)
#   - z tagiem: git tag v1.0.0 && git push --tags
#               (buduje + tworzy release "v1.0.0" z plikami w "Assets")
#
# Projekt nie używa npm/node_modules — "npm" pojawia się tylko po to, żeby pobrać
# gotowe CLI Tauri (npx). Nie trzeba nic instalować lokalnie.
#
# (Chcesz też macOS? Dopisz do macierzy poniżej:
#    - name: macOS (dmg)
#      os: macos-latest
#      artifacts: src-tauri/target/release/bundle/dmg/*.dmg
# )

name: build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag dla Release (np. v1.0.0). Zostaw puste, jeśli chcesz tylko artefakty."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (deb + AppImage)
            os: ubuntu-22.04
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

          - name: Windows (instalator .exe)
            os: windows-latest
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v4

      - name: Zależności systemowe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache (cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Cele bundli bierze z tauri.conf.json ("targets"):
      #   Linux   -> deb + appimage
      #   Windows -> nsis
      - name: Build
        run: npx --yes @tauri-apps/cli@^2 build

      # Zawsze dostępne w zakładce uruchomienia (sekcja "Artifacts").
      - name: Wgraj artefakty
        uses: actions/upload-artifact@v4
        with:
          name: antena-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # Tworzy release tylko wtedy, gdy workflow ruszył z tagu (np. v1.0.0).
  release:
    name: Release
    needs: build
    # Release powstaje, gdy: (a) workflow ruszył z tagu, LUB
    # (b) uruchomiono ręcznie i podano "release_tag".
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz wszystkie artefakty
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Podgląd plików
        run: ls -lR dist

      - name: Utwórz / zaktualizuj release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/**/*
          generate_release_notes: true
          # draft: true   # odkomentuj, jeśli chcesz najpierw przejrzeć release
