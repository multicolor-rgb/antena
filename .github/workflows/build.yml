# Buduje Antenę na Linuksa (deb + AppImage), Windows (instalator .exe, NSIS)
# i Androida (uniwersalny APK arm64 + armv7), a następnie tworzy GitHub Release
# i dołącza do niego zbudowane pliki.
#
# Uruchomienie:
#   - ręcznie:  zakładka "Actions" -> "build" -> "Run workflow"
#               (release powstaje automatycznie z tagiem z wersji, np. v1.0.0;
#                pole "release_tag" pozwala nadpisać ten tag)
#   - z tagiem: git tag v1.0.0 && git push --tags
#               (release z tego tagu)
#
# Projekt nie ma zależności JS w aplikacji. `package.json` istnieje tylko po to,
# żeby zainstalować gotowe CLI Tauri — plugin Gradle Androida wywołuje
# `npm run tauri` (samo `npx` nie wystarcza, bo nie tworzy node_modules).
# Projekt Android (`src-tauri/gen/android`) jest generowany na runnerze przez
# `tauri android init` i nie jest wersjonowany.
#
# (Chcesz też macOS? Dopisz do macierzy poniżej:
#    - name: macOS (dmg)
#      os: macos-latest
#      artifacts: src-tauri/target/release/bundle/dmg/*.dmg
# )

name: build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Opcjonalny tag dla Release (np. v1.0.0). Puste = tag z wersji w tauri.conf.json."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (deb + AppImage)
            os: ubuntu-22.04
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

          - name: Windows (instalator .exe)
            os: windows-latest
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v4

      - name: Zależności systemowe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache (cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Cele bundli bierze z tauri.conf.json ("targets"):
      #   Linux   -> deb + appimage
      #   Windows -> nsis
      - name: Build
        run: npx --yes @tauri-apps/cli@^2 build

      # Dodatkowo zawsze dostępne w zakładce uruchomienia (sekcja "Artifacts").
      - name: Wgraj artefakty
        uses: actions/upload-artifact@v4
        with:
          name: antena-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: NDK r29
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          local-cache: true

      # setup-ndk rozpakowuje NDK bez zachowania dowiązań (np. clang -> clang-XX),
      # przez co cc/ring nie potrafią skompilować kodu C dla Androida.
      # To samo obejście stosuje CI Tauri.
      - name: Napraw dowiązania NDK
        run: |
          directory="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          find "$directory" -type l | while read -r link; do
            current_target=$(readlink "$link")
            new_target="$directory/$(basename "$current_target")"
            ln -sf "$new_target" "$link"
          done

      - name: Rust + cele Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache (cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      # Runner ma już ANDROID_HOME; dokładamy tylko platformę/build-tools,
      # jeśli obraz ich nie zawiera (nie przerywamy, gdy są).
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-brak}"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=sdkmanager
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "platforms;android-37" "build-tools;37.0.0" >/dev/null || true

      - name: Zależności Node (tylko CLI Tauri)
        run: npm ci

      - name: Wygeneruj projekt Android
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npm run tauri -- android init --ci --skip-targets-install

      # Strumienie po HTTP + podpis debug, żeby APK dał się zainstalować bez sekretów.
      - name: Patch projektu Android
        run: python3 scripts/android-patch.py

      - name: Build APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npm run tauri -- android build --apk --ci --target aarch64 armv7

      - name: Sprawdź i przygotuj APK
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          echo "APK: $apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libantena_lib.so'
          unzip -l "$apk" | grep -q 'lib/armeabi-v7a/libantena_lib.so'
          version=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          mkdir -p android-dist
          cp "$apk" "android-dist/antena-${version}-android.apk"
          ls -l android-dist

      - name: Wgraj artefakt
        uses: actions/upload-artifact@v4
        with:
          name: antena-android
          path: android-dist/*.apk
          if-no-files-found: error

  # Bez żadnego warunku: jeśli "build" i "android" się udadzą, release powstaje.
  # (Jeśli ten job jest "skipped", któryś z poprzednich padł — sprawdź jego log.)
  release:
    name: Release
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Kolejność: ręcznie wpisany tag > tag, z którego ruszył workflow > v<wersja>
      - name: Ustal tag
        id: t
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="v$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Pobierz wszystkie artefakty
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Podgląd plików
        run: ls -lR dist

      - name: Utwórz / zaktualizuj release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.t.outputs.tag }}
          files: dist/**/*
          generate_release_notes: true
          # draft: true   # odkomentuj, jeśli chcesz najpierw przejrzeć release
